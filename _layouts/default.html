<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>{{ page.title }} | ZahBeauty</title>
  <meta name="description" content="{{ page.title }} for the ZahBeauty booking app." />

  <!-- Same fonts as the app: Cormorant Garamond for headings, DM Sans for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Brand tokens, copied from constants/theme.ts in the app */
    :root {
      --charcoal: #1c1c1c;
      --gold: #c9a96e;
      --gold-text: #8a6a36; /* darker gold for link text so it stays readable on cream */
      --cream: #faf7f2;
      --blush: #f5ede8;
      --stone: #8a8a8a;
      --border: #e8e3dc;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
    }

    ::selection {
      background: var(--blush);
    }

    /* Header: matches the charcoal band at the top of the app emails */
    .masthead {
      background: var(--charcoal);
      text-align: center;
      padding: 44px 20px 40px;
    }

    .masthead a {
      text-decoration: none;
    }

    .wordmark {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 44px;
      line-height: 1;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .tagline {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold);
      opacity: 0.8;
    }

    /* Document column */
    .doc {
      max-width: 700px;
      margin: 0 auto;
      padding: 56px 24px 24px;
    }

    .doc-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 48px;
      line-height: 1.1;
      margin: 0;
    }

    .updated {
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--stone);
    }

    .title-rule {
      width: 56px;
      height: 2px;
      background: var(--gold);
      margin: 28px 0 8px;
      border: 0;
    }

    /* Markdown content */
    .content h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 28px;
      line-height: 1.25;
      margin: 0 0 12px;
    }

    .content p,
    .content ul {
      margin: 0 0 16px;
    }

    .content ul {
      padding-left: 22px;
    }

    .content li {
      margin-bottom: 8px;
    }

    .content li::marker {
      color: var(--gold);
    }

    .content strong {
      font-weight: 700;
    }

    .content hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 40px 0;
    }

    .content a,
    .site-footer a {
      color: var(--gold-text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      word-break: break-word;
    }

    .content a:hover,
    .site-footer a:hover {
      color: var(--charcoal);
    }

    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* Contact block at the bottom of each document */
    .content .contact {
      padding: 20px 24px;
      background: var(--blush);
      border-left: 3px solid var(--gold);
      border-radius: 0 8px 8px 0;
    }

    /* Footer: links between the two documents */
    .site-footer {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 24px 56px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--stone);
    }

    .site-footer nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      margin-bottom: 12px;
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 600px) {
      .wordmark {
        font-size: 38px;
      }

      .doc {
        padding-top: 40px;
      }

      .doc-title {
        font-size: 38px;
      }

      .content h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wordmark">ZahBeauty</div>
    <div class="tagline">NATURAL HAIR &middot; PHILADELPHIA</div>
  </header>

  <main class="doc">
    <!-- title and last_updated come from the front matter at the top of each .md file -->
    <h1 class="doc-title">{{ page.title }}</h1>
    {% if page.last_updated %}
    <p class="updated">Last updated {{ page.last_updated }}</p>
    {% endif %}
    <hr class="title-rule" />

    <div class="content">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <!-- Relative links so they work under /zahbeauty-legal/ without a baseurl -->
    <nav aria-label="Legal documents">
      <a href="privacy-policy">Privacy Policy</a>
      <a href="terms-of-service">Terms of Service</a>
      <a href="mailto:zahbeauty3@gmail.com">zahbeauty3@gmail.com</a>
    </nav>
    <p>&copy; {{ site.time | date: "%Y" }} ZahBeauty, Philadelphia, PA</p>
  </footer>
</body>
</html>
